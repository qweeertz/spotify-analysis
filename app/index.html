<!doctype html>
<!--
  Browser version of the app: stlite runs Streamlit and Python (Pyodide) inside
  the visitor's browser, so the uploaded zip never leaves their computer.

  Try it locally from the project root:
    python -m http.server 8000 --bind 127.0.0.1
  then open http://localhost:8000/app/
  (--bind 127.0.0.1: only your own computer can reach the server, not others
  on your network; it serves the whole project folder, data/ included.)
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spotify streaming history</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.css"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser@1.12.0/build/stlite.js";

      // Python files to copy into the browser's virtual file system:
      // path there -> URL to fetch it from (relative to this page).
      const files = {
        "streamlit_app.py": { url: "./streamlit_app.py" },
      };
      for (const module of ["__init__", "load", "analysis", "charts"]) {
        files[`spotify_analysis/${module}.py`] = {
          url: `../src/spotify_analysis/${module}.py`,
        };
      }

      mount(
        {
          // Installed in the browser; numpy comes with pandas, streamlit
          // with stlite.
          requirements: ["pandas", "plotly", "tzdata"],
          entrypoint: "streamlit_app.py",
          files,
        },
        document.getElementById("root"),
      );
    </script>
  </body>
</html>
