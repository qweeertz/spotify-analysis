[project]
name = "spotify-analysis"
version = "0.1.0"
description = "Explore your Spotify extended streaming history in a Streamlit app that runs in the browser."
readme = "README.md"
authors = [
    { name = "Henning"}
]
requires-python = ">=3.12"
dependencies = [
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
    "tzdata>=2026.6",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyterlab>=4.6.6",
    "ruff>=0.17.4",
]

[tool.ruff.lint]
# Default rules (pyflakes, pycodestyle) plus import sorting, bugbear, pyupgrade,
# simplify and ruff's own checks.
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The en dash (–) and multiplication sign (×) in labels and docstrings are on
# purpose.
ignore = ["RUF001", "RUF002", "RUF003"]
